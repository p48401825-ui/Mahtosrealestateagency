<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Mahto's Real Estate</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="logo">Mahto<span>'s</span> Real Estate</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="properties.html">Properties</a>
      <a href="contact.html">Contact</a>
    </div>
    <button class="nav-toggle">☰</button>
  </nav>

  <section class="section">
    <div class="container">
      <div class="form-card">
        <h2>Create Account</h2>
        <div id="alert"></div>
        <form id="regForm">
          <div class="field"><label>Full Name</label><input name="name" required placeholder="Your name"></div>
          <div class="field"><label>Email</label><input name="email" type="email" required placeholder="you@example.com"></div>
          <div class="field"><label>Phone</label><input name="phone" type="tel" placeholder="+91 98765 43210"></div>
          <div class="field"><label>Password (min 6 characters)</label><input name="password" type="password" minlength="6" required></div>
          <button class="btn" type="submit" style="width:100%">Register</button>
        </form>
        <p style="text-align:center;margin-top:16px;color:var(--muted)">
          Already have an account? <a href="login.html" style="color:var(--accent)">Login</a>
        </p>
        <p class="legal-note" style="text-align:center">By registering you agree to our <a href="terms.html" style="color:var(--muted)">Terms</a> & <a href="privacy.html" style="color:var(--muted)">Privacy Policy</a>.</p>
      </div>
    </div>
  </section>

  <script src="js/app.js"></script>
  <script>
    document.getElementById('regForm').addEventListener('submit', e => {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(e.target));
      const alertBox = document.getElementById('alert');
      App.api('/auth/register', { method: 'POST', body: JSON.stringify(body) })
        .then(d => {
          App.saveSession(d.token, d.user);
          location.href = 'dashboard.html';
        })
        .catch(err => App.showAlert(alertBox, err.message, 'error'));
    });
  </script>
</body>
</html>
