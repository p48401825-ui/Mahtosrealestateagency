<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mahto's Real Estate Agency | Home</title>
  <meta name="description" content="Mahto's Real Estate Agency — buy, sell and rent properties in Udhampur & Jammu. Trusted RERA-compliant agency.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="logo">Mahto<span>'s</span> Real Estate</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="properties.html">Properties</a>
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
      <a href="contact.html">Contact</a>
      <a href="blog.html">Blog</a>
    </div>
    <button class="nav-toggle">☰</button>
  </nav>

  <header class="hero">
    <h1>Find Your Dream Property<br>in Jammu & Kashmir</h1>
    <p>RERA-compliant agency with 10+ years of experience</p>
    <form id="searchForm" class="search-form">
      <input type="text" name="q" placeholder="Search properties..." required>
      <select name="city">
        <option value="">All cities</option>
        <option value="udhampur">Udhampur</option>
        <option value="jammu">Jammu</option>
        <option value="ramnagar">Ramnagar</option>
      </select>
      <select name="type">
        <option value="">All types</option>
        <option value="house">House</option>
        <option value="apartment">Apartment</option>
        <option value="plot">Plot</option>
      </select>
      <button type="submit">Search</button>
    </form>
  </header>

  <section class="section">
    <div class="container">
      <div class="section-head"><h2>Featured Properties</h2><p>Handpicked listings for you</p></div>
      <div id="properties" class="grid grid-3"></div>
    </div>
  </section>

  <footer class="footer">
    <div class="footer-bottom"><p>© 2025 Mahto's Real Estate Agency · <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a></p></div>
  </footer>

  <script src="js/app.js"></script>
  <script>
    document.getElementById('searchForm').addEventListener('submit', e => {
      e.preventDefault();
      const f = e.target;
      const q = new URLSearchParams();
      for (const el of f.elements) {
        if (el.name && el.value) q.set(el.name, el.value);
      }
      location.href = 'properties.html?' + q.toString();
    });
  </script>
</body>
</html>
