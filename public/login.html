<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Mahto's Real Estate</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="logo">Mahto<span>'s</span> Real Estate</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="properties.html">Properties</a>
      <a href="contact.html">Contact</a>
    </div>
    <button class="nav-toggle">☰</button>
  </nav>

  <section class="section">
    <div class="container">
      <div class="form-card">
        <h2>Welcome Back 👋</h2>
        <div id="alert"></div>
        <form id="loginForm">
          <div class="field"><label>Email</label><input name="email" type="email" required placeholder="you@example.com"></div>
          <div class="field"><label>Password</label><input name="password" type="password" required placeholder="••••••••"></div>
          <button class="btn" type="submit" style="width:100%">Login</button>
        </form>
        <p style="text-align:center;margin-top:16px;color:var(--muted)">
          New here? <a href="register.html" style="color:var(--accent)">Create an account</a>
        </p>
      </div>
    </div>
  </section>

  <script src="js/app.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', e => {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(e.target));
      const alertBox = document.getElementById('alert');
      App.api('/auth/login', { method: 'POST', body: JSON.stringify(body) })
        .then(d => {
          App.saveSession(d.token, d.user);
          location.href = d.user.role === 'admin' ? 'admin.html' : 'dashboard.html';
        })
        .catch(err => App.showAlert(alertBox, err.message, 'error'));
    });
  </script>
</body>
</html>
